<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Africa Carbon Credits Analytics Dashboard</title>
    <meta name="description" content="Comprehensive analytics dashboard for African carbon credits data with real-time insights, interactive visualizations, and advanced filtering capabilities." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carbon-analytics.example.com/" />
    <meta property="og:title" content="Africa Carbon Credits Analytics Dashboard" />
    <meta property="og:description" content="Comprehensive analytics dashboard for African carbon credits data with real-time insights, interactive visualizations, and advanced filtering capabilities." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://carbon-analytics.example.com/" />
    <meta property="twitter:title" content="Africa Carbon Credits Analytics Dashboard" />
    <meta property="twitter:description" content="Comprehensive analytics dashboard for African carbon credits data with real-time insights, interactive visualizations, and advanced filtering capabilities." />

    <!-- Preconnect for Lord Icon (critical for hero icons) -->
    <link rel="preconnect" href="https://cdn.lordicon.com">
    
    <!-- DNS prefetch for Google Analytics (non-critical third party) -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://www.google-analytics.com">
    
    <!-- Preload critical self-hosted fonts for faster rendering -->
    <link rel="preload" href="/fonts/StackSansText-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/StackSansNotch-Variable.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/carbon-icon.webp" />
    <link rel="alternate icon" type="image/png" href="/carbon-icon.png" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carbon Analytics" />
    <link rel="apple-touch-icon" href="/carbon-icon.webp" />
    <link rel="apple-touch-icon" type="image/png" href="/carbon-icon.png" />

  </head>
  <body class="dark">
    <div id="root"></div>
    <script src="https://cdn.lordicon.com/lordicon.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Google Analytics loaded after main content (non-blocking) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B5F1JWSXTZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-B5F1JWSXTZ');
    </script>
  </body>
</html>
